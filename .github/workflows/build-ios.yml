name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build App
        run: |
          xcodebuild -project PocketAI.xcodeproj \
                     -scheme PocketAI \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath BuildData \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r BuildData/Build/Products/Release-iphoneos/PocketAI.app Payload/
          zip -r PocketAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-Unsigned-IPA
          path: PocketAI.ipa
          if-no-files-found: error
