name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest Xcode available on the runner
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          rm -rf PocketAI.xcodeproj
          xcodegen generate --spec project.yml

      - name: Build App
        run: |
          xcodebuild -project PocketAI.xcodeproj \
                     -scheme PocketAI \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath BuildData \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" 2>&1 | tail -100

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r BuildData/Build/Products/Release-iphonesimulator/PocketAI.app Payload/
          zip -r PocketAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-Unsigned-IPA
          path: PocketAI.ipa
          if-no-files-found: error
