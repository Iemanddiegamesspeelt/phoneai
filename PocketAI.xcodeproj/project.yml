name: PocketAI
options:
  bundleIdPrefix: com.pocketai
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settingGroups:
  signing:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  PocketAI:
    type: application
    platform: iOS
    sources:
      - path: PocketAI
        excludes:
          - "**/*.md"
          - "Resources/**"
    resources:
      - path: PocketAI/Resources
        excludes:
          - "**/*.swift"
    settings:
      groups:
        - signing
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketai.PocketAI
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PocketAI/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketAI/App/PocketAI.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        CLANG_ENABLE_MODULES: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  PocketAI:
    build:
      targets:
        PocketAI: [build, run, test, profile, analyze, archive]
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
